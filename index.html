<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cours de bourse</title>
</head>
<body>
  <h1>Cours d’une action</h1>

  <label for="symbol">Symbole :</label>
  <input id="symbol" value="IBM">
  <button id="load">Afficher le cours</button>

  <p id="result">Saisissez un symbole.</p>

  <script>
    const API_KEY = "EAIJNNBVOB1J35LY;

    document.querySelector("#load").addEventListener("click", async () => {
      const symbol = document.querySelector("#symbol").value.trim();
      const result = document.querySelector("#result");

      if (!symbol) {
        result.textContent = "Veuillez saisir un symbole.";
        return;
      }

      result.textContent = "Chargement…";

      const url = new URL("https://www.alphavantage.co/query");
      url.search = new URLSearchParams({
        function: "GLOBAL_QUOTE",
        symbol,
        apikey: API_KEY
      });

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Erreur réseau");

        const data = await response.json();

        if (data["Error Message"]) {
          throw new Error(data["Error Message"]);
        }
        if (data.Note || data.Information) {
          throw new Error("Limite de requêtes atteinte ou information API.");
        }

        const quote = data["Global Quote"];
        if (!quote || !quote["05. price"]) {
          throw new Error("Aucun cours trouvé pour ce symbole.");
        }

        result.textContent =
          `${quote["01. symbol"]} : ${Number(quote["05. price"]).toFixed(2)} USD`;
      } catch (error) {
        result.textContent = `Impossible de récupérer le cours : ${error.message}`;
      }
    });
  </script>
</body>
</html>
